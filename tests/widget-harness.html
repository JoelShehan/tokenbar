<!doctype html><html><head><meta charset="UTF-8"><title>Widget regression harness</title></head>
<body><div id="root"></div><script type="module">
import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
import { emit } from "@tauri-apps/api/event";
const fixture = window.fixture = { mode: "connected", codexMode: null, apiMode: null, calls: [], startup: false, scale: 1, missingMonitor: false, position: { x: 100, y: 100 }, area: { position: { x: 0, y: 0 }, size: { width: 1920, height: 1040 } } };
window.emitTestEvent = emit;
mockWindows("main");
mockIPC(async (cmd, args) => {
  fixture.calls.push({ cmd, args });
  if (cmd === "plugin:window|set_size") { await window.resizeNative(args.value.toJSON().Logical); return; }
  if (cmd === "plugin:window|outer_size") return { width: innerWidth * fixture.scale, height: innerHeight * fixture.scale };
  if (cmd === "plugin:window|outer_position") return fixture.position;
  if (cmd === "plugin:window|set_position") { fixture.position = args.value.toJSON().Physical; return; }
  if (cmd === "plugin:window|current_monitor" && fixture.missingMonitor) return null;
  if (cmd === "plugin:window|current_monitor" || cmd === "plugin:window|primary_monitor") return { name: "Test monitor", scaleFactor: fixture.scale, size: fixture.area.size, position: fixture.area.position, workArea: fixture.area };
  if (cmd === "plugin:autostart|is_enabled") return fixture.startup;
  if (cmd === "plugin:autostart|enable") { fixture.startup = true; return; }
  if (cmd === "plugin:autostart|disable") { fixture.startup = false; return; }
  if (cmd === "is_codex_installed") return (fixture.codexMode ?? fixture.mode) !== "missing";
  if (cmd === "has_openai_key") return (fixture.apiMode ?? fixture.mode) !== "missing";
  if (cmd === "get_codex_version") return "codex-cli test";
  if (cmd === "plugin:app|version" || cmd === "plugin:app|tauri_version") return "0.1.0-test";
  if (cmd === "get_codex_usage" || cmd === "get_openai_usage") {
    const mode = (cmd === "get_codex_usage" ? fixture.codexMode : fixture.apiMode) ?? fixture.mode;
    if (mode === "expired") throw new Error("403 expired token");
    if (mode === "offline") throw new Error("Connection timed out");
    if (mode === "auth") throw new Error("401 Unauthorized");
    if (mode === "slow") await new Promise(resolve => setTimeout(resolve, 300));
    if (fixture.mode === "malformed") return { limits: { rateLimits: { primary: { usedPercent: "not-a-number" } } }, total_tokens: -1 };
    if (fixture.mode === "secret-error") throw new Error("Authorization: Bearer TEST_SECRET_SENTINEL sk-test-only-sentinel");
    if (fixture.mode === "auth") throw new Error("401 Unauthorized");
    if (fixture.mode === "offline") throw new Error("Connection timed out");
    if (fixture.mode === "slow") await new Promise(resolve => setTimeout(resolve, 300));
    if (cmd === "get_openai_usage") return { total_tokens: 0, total_input_tokens: 0, total_output_tokens: 0, total_cost_usd: 0 };
    return { limits: { rateLimits: { planType: "plus", primary: { usedPercent: 66, windowDurationMins: 300, resetsAt: 1789504685 }, secondary: { usedPercent: 51, windowDurationMins: 10080, resetsAt: 1789841164 } } }, activity: { summary: { lifetimeTokens: 879975146, peakDailyTokens: 64960764 } } };
  }
}, { shouldMockEvents: true });
await import("/src/main.tsx");
</script></body></html>
